<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JRI | Standalone QR Scanner</title><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><style>
:root{font-family:Arial,sans-serif;color:#172b3a;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:760px;margin:auto;padding:18px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand{font-size:22px;font-weight:700;color:#145b91}.panel{background:#fff;border:1px solid #dce3eb;border-radius:12px;padding:16px;margin:14px 0;box-shadow:0 2px 8px #102a430d}button,input{font:inherit;border-radius:8px;padding:11px;border:1px solid #cbd5e1}button{background:#1769aa;color:white;border:0;font-weight:700;cursor:pointer;margin:4px 5px 4px 0}button.secondary{background:#e8f1f8;color:#174b70;border:1px solid #c6d8e8}button:disabled{opacity:.5;cursor:not-allowed}#reader{max-width:540px;margin:12px auto}.notice{white-space:pre-wrap;background:#eff6ff;border-radius:8px;padding:12px;line-height:1.45}.muted{color:#64748b;font-size:13px}input[type=text]{width:100%;margin:8px 0}.status{font-weight:600}@media(max-width:520px){.wrap{padding:10px}.panel{padding:12px}}
</style></head><body><main class="wrap"><header class="top"><div class="brand">JRI · Sample QR Scanner</div><div class="muted">Standalone HTTPS camera window</div></header><section class="panel"><h2>Scan QR Code</h2><p class="muted">Keep the original JRI Sample Scanner tab open. The scanned QR text will be returned to that tab for authorized processing.</p><button id="start" onclick="startCamera()">Start Camera</button><button class="secondary" onclick="stopCamera()">Stop Camera</button><button class="secondary" id="switch" onclick="switchCamera()" disabled>Switch Camera</button><div id="reader"></div><div id="status" class="notice status">Checking connection to JRI…</div></section><section class="panel"><h3>Manual QR text fallback</h3><input id="manual" type="text" placeholder="Paste decoded QR text here"><button onclick="sendManual()">Send to JRI</button></section></main><script>
let qr=null,cameras=[],cameraIndex=0,active=false,lastText='',returnOrigin='',channel='';
const status=(m,bad=false)=>{const e=document.getElementById('status');e.textContent=m;e.style.background=bad?'#fff1f2':'#eff6ff';};
function setup(){const p=new URLSearchParams(location.search);returnOrigin=p.get('returnOrigin')||'';channel=p.get('channel')||'';let u;try{u=new URL(returnOrigin);}catch(e){status('Invalid return origin. Reopen this scanner from the JRI Sample Scanner page.',true);return false;}if(u.protocol!=='https:'||!channel||!window.opener){status('This scanner must be opened from the authenticated JRI Sample Scanner page over HTTPS. Do not open it directly.',true);return false;}status('Connected to the JRI tab. Choose Start Camera.');return true;}
function sendPayload(payload){if(!payload||!window.opener){status('No JRI parent tab is available. Reopen the scanner from JRI.',true);return;}try{window.opener.postMessage({type:'JRI_QR_SCAN',channel:channel,payload:String(payload)},returnOrigin);status('QR sent to JRI. You can scan the next code when ready.');}catch(e){status('Could not return QR to JRI: '+(e.message||e),true);}}
async function startCamera(){if(!setup())return;if(!window.isSecureContext||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){status('Camera access requires a secure HTTPS page and a supported browser. Use manual QR text fallback.',true);return;}if(!window.Html5Qrcode){status('QR scanner library did not load. Check internet access or use manual fallback.',true);return;}try{if(!qr)qr=new Html5Qrcode('reader');cameras=await Html5Qrcode.getCameras();if(!cameras.length){status('No camera was found. Connect a camera or use manual fallback.',true);return;}cameraIndex=Math.min(cameraIndex,cameras.length-1);document.getElementById('switch').disabled=cameras.length<2;await qr.start(cameras[cameraIndex].id,{fps:10,qrbox:{width:250,height:250},aspectRatio:1.0},(text)=>{if(!text||text===lastText)return;lastText=text;sendPayload(text);setTimeout(()=>{lastText='';},1200);},()=>{});active=true;document.getElementById('start').disabled=true;status('Camera is active. Point it at a JRI Team QR or Sample QR.');}catch(e){let m=e&&e.message||String(e);if((e&&e.name==='NotAllowedError')||/permission|denied/i.test(m))m='Camera permission was denied. In Edge, allow Camera for this standalone HTTPS site, then reload this page.';else if(e&&e.name==='NotFoundError')m='No camera was found. Connect or select a camera.';else if(e&&e.name==='NotReadableError')m='The camera is busy or unavailable. Close other applications using it and retry.';status('Camera error: '+m,true);}}
async function stopCamera(){if(qr&&active){try{await qr.stop();}catch(e){}try{qr.clear();}catch(e){}active=false;document.getElementById('start').disabled=false;status('Camera stopped.');}}
async function switchCamera(){if(cameras.length<2)return;const wasActive=active;await stopCamera();cameraIndex=(cameraIndex+1)%cameras.length;if(wasActive)startCamera();}
function sendManual(){const v=document.getElementById('manual').value.trim();if(!v){status('Paste the QR text first.',true);return;}sendPayload(v);document.getElementById('manual').value='';}
window.addEventListener('beforeunload',()=>{if(qr&&active)qr.stop().catch(()=>{});});setup();
</script></body></html>
